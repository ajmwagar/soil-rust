[package]
name = "soil-lang"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Rust bootstrap compiler and interpreter for Soil"

[dependencies]
anyhow = "1"
blake3 = "1"
serde_json = "1"
wasm-encoder = "0.263.0"

[[bin]]
name = "soil-c"
path = "src/bin/soil-c.rs"

[[bin]]
name = "soil-run"
path = "src/bin/soil-run.rs"

[lints]
workspace = true
